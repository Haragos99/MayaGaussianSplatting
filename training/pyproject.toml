[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gstrain"
version = "0.1.0"
description = "Gaussian Splatting trainer (COLMAP in, 3DGS .ply out). No Maya dependency."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
train = ["torch>=2.1", "pillow>=10.0", "tqdm>=4.65"]
dev = ["pytest>=7.4"]

[project.scripts]
gstrain = "gstrain.cli:main"

[tool.setuptools.packages.find]
include = ["gstrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
